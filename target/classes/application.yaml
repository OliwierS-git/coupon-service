spring:
  application:
    name: coupon-service

  datasource:
    url: jdbc:postgresql://localhost:5433/projektdb
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: coupons

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: coupons

geolocation:
  provider:
    base-url: http://ip-api.com
    connect-timeout: 2s
    read-timeout: 3s